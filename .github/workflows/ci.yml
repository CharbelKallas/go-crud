name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: recordings
          MYSQL_USER: app
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./... && go vet -tags integration ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        env:
          INTEGRATION_ALLOW_DB_RESET: "1"
          DB_USERNAME: app
          DB_PASSWORD: ci-password
          DATABASE_ADDR: 127.0.0.1:3306
          DB_DATABASE: recordings
        run: go test -race -tags integration ./integration/...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Docker build
        run: docker build .
